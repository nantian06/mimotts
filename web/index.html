<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MiMo TTS 工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318233D'/%3E%3Cpath d='M8 16h2M12 11v10M16 7v18M20 12v8M24 15v2' stroke='%23F5F6F8' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='7' r='3' fill='%23E2463C'/%3E%3C/svg%3E">
  <script>
    // 首屏前应用主题，避免闪白
    try {
      var t = localStorage.getItem('mt.theme');
      if (t === '"dark"' || t === '"light"') document.documentElement.dataset.theme = JSON.parse(t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>这个工作台需要启用 JavaScript。</noscript>
</body>
</html>
